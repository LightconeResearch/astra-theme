jtex: v1
title: ASTRA Article Theme
description: >-
  Rich MyST web theme for single-article ASTRA analyses — the presentation half
  of the @astra-spec pair. Extends @myst-theme/article with glyph-tagged inline
  references and hover preview cards, decision/finding/output treatments,
  live-value provenance, and registry tables — keyed on the neutral astra-*
  markers the @astra-spec/mystra plugin emits. A document that renders cleanly
  on article-theme renders richly here by changing one line:
  `site.template: astra-article-theme`.
version: 0.0.7
license: BSD-3-Clause
source: https://github.com/LightconeResearch/astra-theme
tags:
  - article
  - astra
options:
  - type: boolean
    id: hide_toc
    description: Hide the table of contents
  - type: boolean
    id: hide_footer_links
    description: Hide the previous/next links in the footer
  - type: boolean
    id: hide_outline
    description: Hide the document outline on all pages
  - type: boolean
    id: hide_authors
    description: Hide the authors list on all pages
  - type: number
    id: outline_maxdepth
    description: The maximum depth to show on the document outline
    min: 1
    max: 6
    integer: true
  - type: string
    id: twitter
    description: Twitter handle related to the site
  - type: file
    id: favicon
    description: Local path to favicon image
  - type: file
    id: logo
    description: Local path to logo image
  - type: file
    id: logo_dark
    description: Local path to logo image for dark mode
  - type: string
    id: logo_text
    description: Short text to display next to logo at the top of all pages
  - type: string
    id: logo_url
    description: If specified, link logo to this URL. Otherwise, point to root page.
  - type: string
    id: logo_alt
    description: Alt text to attach to the logo
  - type: string
    id: analytics_google
    description: Google analytics key
  - type: string
    id: analytics_plausible
    description: Plausible analytics key
  - type: boolean
    id: numbered_references
    description: Show references as numbered, rather than in APA-style
  - type: boolean
    id: folders
    description: Respect nested folder structure in URL paths
  - type: string
    id: internal_domains
    description: A domain to treat as internal links
  - type: file
    id: style
    description: Local path to an extra CSS file (layered on top of the ASTRA stylesheet)
build:
  # The published artifact ships a minimal runtime package.json (server deps
  # only — the Remix build bundles everything else), so a plain npm install
  # works with or without a lockfile. That also lets `site.template` point at
  # a local source checkout of this theme (build it first: npm run build).
  install: npm install --ignore-scripts
  start: npm run start
files:
  - server.js
  - package.json
  - public/**/*
  - build/**/*
