# MyST site template descriptor — makes this repo usable as `site.template`.
#
#   site:
#     template: https://github.com/.../astra-theme   # or a local path / registered name
#
# `kind: site` tells the engine this is a web theme: it runs `build.install` then
# `build.start`, passing PORT / CONTENT_CDN_PORT / MODE in the environment (see
# DEVELOPING.md). The app shell is vendored from @myst-theme/book at build; this
# repo overlays the ASTRA renderers + store provider (see app/root.tsx).
myst: v1
kind: site

title: ASTRA Theme
description: A rich MyST web theme for ASTRA analyses — glyph-tagged inline references with hover preview cards, decision/finding/output treatments, and live-value provenance.
version: 0.1.0
license: BSD-3-Clause

# Theme authors / source.
author: Lightcone Research
source: https://github.com/LightconeResearch/astra-theme

# Site-level options, mirroring the useful ones from @myst-theme/book.
# Exposed to the author under `site.options` in their `myst.yml`.
options:
  - id: hide_toc
    type: boolean
    description: Hide the left table-of-contents / navigation sidebar.
  - id: hide_outline
    type: boolean
    description: Hide the right-hand in-page outline (on-this-page).
  - id: hide_footer_links
    type: boolean
    description: Hide the previous/next page links in the footer.
  - id: hide_search
    type: boolean
    description: Hide the search affordance in the header.
  - id: outline_maxdepth
    type: number
    description: Maximum heading depth shown in the in-page outline.
  - id: folders
    type: boolean
    description: Preserve folder structure when generating navigation URLs.
  - id: logo_text
    type: string
    description: Wordmark text shown in the header / left rail.

# Build hooks the engine runs to install deps and launch the theme server.
build:
  install: npm ci
  start: npm run start

# Files shipped in the built template bundle (compiled app + static assets).
files:
  - server.js
  - package.json
  - package-lock.json
  - public/**/*
  - build/**/*
  - styles/**/*
