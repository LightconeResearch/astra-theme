name: Publish theme

# Tag-driven release. Pushing a tag like `v0.0.1` is the ONLY action needed:
# the tag is the source of truth for the version. This workflow stamps that
# version into package.json + template.yml, builds the theme, pushes the
# runnable artifact (template.yml + server.js + package*.json + build/ + public/)
# to the deploy repo mirroring the tag, attaches a zip to a GitHub Release, and
# commits the version bump back to main.
#
# One-time setup:
#   - Create the deploy repo (Eiffl/astra-theme) — empty is fine.
#   - Add a repo secret DEPLOY_TOKEN: a fine-grained PAT with Contents: read/write
#     on Eiffl/astra-theme.
#
# Cut a release:
#   git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)publish, e.g. v0.0.1"
        required: true

permissions:
  contents: write # commit the version bump to main + create the Release

env:
  DEPLOY_REPO: Eiffl/astra-theme
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }} # build the exact tagged commit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag
        run: |
          set -euo pipefail
          v="${VERSION#v}" # strip leading "v": v0.0.1 -> 0.0.1
          npm version "$v" --no-git-tag-version --allow-same-version # package.json + package-lock.json
          sed -i -E "s/^version:.*/version: $v/" template.yml
          echo "Stamped version $v"

      - name: Build theme
        run: npm run build # → build/ + public/ (runs prod:copy, thebe, css, remix build)

      - name: Assemble publish tree
        run: |
          set -euo pipefail
          test -d build && test -d public || { echo "build/ or public/ missing — build failed"; exit 1; }
          rm -rf dist-publish
          mkdir -p dist-publish
          # exactly the set declared in template.yml `files:`, plus the manifest + legal
          cp template.yml server.js package.json package-lock.json dist-publish/
          cp -r build public dist-publish/
          for f in LICENSE NOTICE; do [ -f "$f" ] && cp "$f" dist-publish/; done
          cat > dist-publish/README.md <<EOF
          # astra-theme (published build)

          This repository holds the **build artifacts** for the
          [astra-theme](https://github.com/LightconeResearch/astra-theme) MyST web theme.
          It is generated by CI — do not edit by hand. Open issues and PRs against the
          source repo.

          Use it in a MyST project:

          \`\`\`yaml
          site:
            template: https://github.com/${DEPLOY_REPO}
          \`\`\`

          Published from \`${VERSION}\`.
          EOF

      - name: Push to deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERSION}" || { echo "VERSION is empty"; exit 1; }
          cd dist-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${VERSION}"
          git branch -M main
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${DEPLOY_REPO}.git"
          # main is a clean mirror of the latest build (no accumulating binary history);
          # each version is preserved as its own tag so users can pin.
          git push -f origin main
          git tag -f "${VERSION}"
          git push -f origin "refs/tags/${VERSION}"

      - name: Package zip
        run: |
          set -euo pipefail
          ( cd dist-publish && zip -qr "../astra-theme-${VERSION}.zip" . )

      - name: Create release with zip asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: astra-theme-${{ env.VERSION }}.zip

      - name: Commit version bump to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json template.yml
          git diff --staged --quiet || (git commit -m "chore: bump version to ${VERSION#v}" && git push origin HEAD:main)
