name: Publish theme

# Builds the theme and pushes the runnable artifact (template.yml + server.js +
# package*.json + build/ + public/) to the deploy repo, mirroring the release
# tag. The deploy repo is what users point `site.template:` at — the build/ and
# public/ dirs are gitignored here, so they only ever exist in the published one.
#
# Setup required once:
#   - Create the deploy repo (Eiffl/astra-theme) — empty is fine.
#   - Add a repo secret DEPLOY_TOKEN: a fine-grained PAT with Contents: read/write
#     on Eiffl/astra-theme.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.1.0). Must already exist as a git tag."
        required: true

permissions:
  contents: write # upload the .zip asset back onto the triggering release

env:
  DEPLOY_REPO: Eiffl/astra-theme
  VERSION: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }} # build the exact tagged commit, not the branch head

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          tag_version="${VERSION#v}" # strip a leading "v": v0.1.0 -> 0.1.0
          manifest_version="$(grep -E '^version:' template.yml | head -1 | sed -E 's/^version:[[:space:]]*//; s/["'\'' ]//g')"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag=${tag_version} template.yml=${manifest_version} package.json=${pkg_version}"
          if [ "${manifest_version}" != "${tag_version}" ] || [ "${pkg_version}" != "${tag_version}" ]; then
            echo "::error::Release tag '${VERSION}' must match template.yml version '${manifest_version}' and package.json version '${pkg_version}'. Bump the manifests or fix the tag, then re-run."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build # → build/ + public/ (runs prod:copy, thebe, css, remix build)

      - name: Assemble publish tree
        run: |
          set -euo pipefail
          test -d build && test -d public || { echo "build/ or public/ missing — build failed"; exit 1; }
          rm -rf dist-publish
          mkdir -p dist-publish
          # exactly the set declared in template.yml `files:`, plus the manifest + legal
          cp template.yml server.js package.json package-lock.json dist-publish/
          cp -r build public dist-publish/
          for f in LICENSE NOTICE; do [ -f "$f" ] && cp "$f" dist-publish/; done
          cat > dist-publish/README.md <<EOF
          # astra-theme (published build)

          This repository holds the **build artifacts** for the
          [astra-theme](https://github.com/LightconeResearch/astra-theme) MyST web theme.
          It is generated by CI — do not edit by hand. Open issues and PRs against the
          source repo.

          Use it in a MyST project:

          \`\`\`yaml
          site:
            template: https://github.com/${DEPLOY_REPO}
          \`\`\`

          Published from \`${VERSION}\`.
          EOF

      - name: Push to deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERSION}" || { echo "VERSION is empty"; exit 1; }
          cd dist-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${VERSION}"
          git branch -M main
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${DEPLOY_REPO}.git"
          # main is a clean mirror of the latest build (no accumulating binary history);
          # each version is preserved as its own tag so users can pin.
          git push -f origin main
          git tag -f "${VERSION}"
          git push -f origin "refs/tags/${VERSION}"

      - name: Package zip
        run: |
          set -euo pipefail
          ( cd dist-publish && zip -qr "../astra-theme-${VERSION}.zip" . )

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: astra-theme-${{ env.VERSION }}.zip
